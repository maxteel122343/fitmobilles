<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitVerso Web — Treino ao Vivo, 550+ Exercícios &amp; Coach IA</title>
  <style>
    :root {
      --navy: #16202C;
      --arena: #1A2530;
      --arena-card: #23303E;
      --teal: #3E8A8F;
      --teal-active: #428C91;
      --teal-soft: #E4F1F2;
      --mint: #3FB27F;
      --amber: #E0B434;
      --coral: #D14545;
      --bg: #F4F6F8;
      --card: #FFFFFF;
      --border: #E2E8F0;
      --ink: #17212B;
      --muted: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--ink); display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px; background: var(--navy); color: #fff; padding: 20px 14px;
      display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; padding: 6px 10px 18px; }
    .brand-icon { width: 34px; height: 34px; border-radius: 9px; background: rgba(66,140,145,0.25); display: grid; place-items: center; color: #5AC8CE; font-weight: 800; }
    .nav-btn {
      width: 100%; border: 0; background: transparent; color: #CBD5E1; text-align: left;
      padding: 11px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; margin-bottom: 4px;
      display: flex; align-items: center; gap: 10px; transition: 0.15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-btn.active { background: var(--teal-active); color: #fff; font-weight: 600; }
    .plan-box {
      background: #202D3C; border: 1px solid #2F4156; border-radius: 12px; padding: 12px;
      font-size: 12px; cursor: pointer;
    }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .mobile-menu-btn { display: none; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 16px; }
    .pill { background: var(--teal-soft); color: var(--teal); padding: 5px 11px; border-radius: 99px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(62,138,143,0.3); }
    .content { padding: 20px; flex: 1; overflow-y: auto; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .btn { border: 0; border-radius: 24px; padding: 11px 18px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-navy { background: var(--navy); color: #fff; }
    .btn-coral { background: var(--coral); color: #fff; }
    .btn-amber { background: var(--amber); color: var(--navy); }
    .btn-slate { background: #475569; color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #fff; color: var(--ink); font-size: 14px; outline: none;
    }
    .arena { background: var(--arena); color: #fff; min-height: calc(100vh - 58px); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .arena-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 16px; flex: 1; }
    .cam-box { background: #0E1620; border: 1px solid #2F4156; border-radius: 16px; position: relative; overflow: hidden; min-height: 320px; display: grid; place-items: center; }
    .cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .cam-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .rep-box { background: var(--arena-card); border: 1px solid rgba(63,178,127,0.45); border-radius: 14px; padding: 10px 26px; font-size: 40px; font-weight: 800; color: var(--mint); }
    .feedback-pill { background: rgba(63,178,127,0.14); border: 1px solid rgba(63,178,127,0.5); color: var(--mint); padding: 10px 14px; border-radius: 12px; font-weight: 600; }
    .chat-box { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 86%; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
    .msg-user { align-self: flex-end; background: var(--teal-soft); border: 1px solid rgba(62,138,143,0.4); }
    .msg-ai { align-self: flex-start; background: #fff; border: 1px solid var(--border); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: 18px; max-width: 620px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab-chip { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
    .tab-chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }
    @media (max-width: 820px) {
      .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; z-index: 50; transition: 0.2s; }
      .sidebar.open { left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .arena-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand"><div class="brand-icon">FV</div><span>FitVerso</span></div>
      <button class="nav-btn active" onclick="go('home', this)">🏠 Início</button>
      <button class="nav-btn" onclick="go('live', this)">🎥 Treino ao vivo</button>
      <button class="nav-btn" onclick="go('exercises', this)">🏋️ 550+ Exercícios</button>
      <button class="nav-btn" onclick="go('history', this)">🕘 Histórico</button>
      <button class="nav-btn" onclick="go('coach', this)">🤖 Coach IA &amp; Voz</button>
      <button class="nav-btn" onclick="go('ai-config', this)">🔑 Modelos &amp; APIs</button>
      <button class="nav-btn" onclick="go('plans', this)">⭐ Planos Básico / Pro</button>
    </div>
    <div>
      <button class="nav-btn" style="background:rgba(62,138,143,0.22);color:#fff;border:1px solid rgba(62,138,143,0.55);margin-bottom:10px" onclick="downloadProjectZip()">📦 Baixar Projeto (.ZIP)</button>
      <div class="plan-box" onclick="go('plans')">
        <div id="sidebar-plan-title" style="font-weight:700;color:#EAB308">Plano Básico</div>
        <div id="sidebar-plan-sub" style="color:#94A3B8;margin-top:3px">Web Mobile &amp; PC ativo</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <strong id="page-title">Início</strong>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="pill" style="background:var(--teal);color:#fff;border-color:var(--teal)" onclick="downloadProjectZip()">📦 Baixar Projeto .ZIP</span>
        <span class="pill" id="ai-badge" onclick="go('ai-config')">Texto: Local Offline</span>
        <span class="pill" id="tier-badge" onclick="go('plans')">BÁSICO</span>
      </div>
    </header>

    <section id="view-home" class="content"></section>
    <section id="view-live" class="arena" style="display:none"></section>
    <section id="view-exercises" class="content" style="display:none"></section>
    <section id="view-history" class="content" style="display:none"></section>
    <section id="view-coach" class="content" style="display:none"></section>
    <section id="view-ai-config" class="content" style="display:none"></section>
    <section id="view-plans" class="content" style="display:none"></section>
  </main>

  <div class="modal-backdrop" id="teach-modal">
    <div class="modal" id="teach-modal-body"></div>
  </div>

  <script>
    const STORAGE_AI = 'fitverso_web_ai_v1';
    const STORAGE_HIST = 'fitverso_web_hist_v1';
    const STORAGE_TIER = 'fitverso_web_tier_v1';

    let aiCfg = JSON.parse(localStorage.getItem(STORAGE_AI) || 'null') || {
      textProvider: 'offline', textModel: 'fitverso-biomech-v1', textKey: '', textUrl: 'https://api.deepseek.com/chat/completions',
      voiceProvider: 'browser', voiceModel: 'tts-1', voiceId: 'alloy', voiceKey: '',
      imageProvider: 'diagram', imageModel: 'gpt-image-1', imageKey: ''
    };
    let historyList = JSON.parse(localStorage.getItem(STORAGE_HIST) || '[]');
    let userTier = localStorage.getItem(STORAGE_TIER) || 'BASIC';

    const CATEGORIES = ['Principais','Pernas & Glúteos','Peito & Empurrar','Costas & Braços','Ombros & Trapézio','Core & Abdômen','Mobilidade & Yoga','Funcional & Kettlebell','Cardio & HIIT'];
    const BASES = [
      ['Agachamento Livre','Quadríceps e Glúteos','Pernas & Glúteos',98,158,'Desça mantendo peito erguido e joelhos alinhados aos pés.'],
      ['Flexão de Braço','Peitoral, Tríceps e Core','Peito & Empurrar',94,156,'Corpo rígido em prancha, cotovelos a 45° do tronco.'],
      ['Rosca Direta','Bíceps Braquial','Costas & Braços',54,150,'Mantenha os cotovelos fixos ao lado das costelas.'],
      ['Afundo / Passada','Quadríceps e Glúteos','Pernas & Glúteos',98,156,'Tronco vertical formando 90° nos dois joelhos.'],
      ['Levantamento Terra Romeno','Posteriores e Glúteos','Pernas & Glúteos',104,165,'Empurre o quadril para trás preservando coluna neutra.'],
      ['Elevação Pélvica','Glúteo Máximo','Pernas & Glúteos',105,168,'Empurre pelos calcanhares e contraia no topo.'],
      ['Desenvolvimento de Ombros','Deltoides e Tríceps','Ombros & Trapézio',92,160,'Contraia o abdômen sem arquear a lombar ao empurrar.'],
      ['Elevação Lateral','Deltoide Lateral','Ombros & Trapézio',25,82,'Eleve até a altura dos ombros conduzindo pelos cotovelos.'],
      ['Remada Curvada','Dorsais e Romboides','Costas & Braços',58,150,'Puxe os cotovelos rente ao quadril com coluna neutra.'],
      ['Prancha Abdominal','Transverso e Core','Core & Abdômen',88,148,'Alinhe ombros, quadril e tornozelos ativando o core.'],
      ['Abdominal Supra','Reto Abdominal','Core & Abdômen',84,144,'Enrole a torácica expirando sem puxar o pescoço.'],
      ['Swing Funcional','Posterior e Potência','Funcional & Kettlebell',104,166,'Impulsione com explosão de quadril, braços só guiam.'],
      ['Polichinelo','Cardio e Coordenação','Cardio & HIIT',28,82,'Aterrissagem macia na ponta dos pés com ritmo estável.'],
      ['Mobilidade Torácica / Yoga','Coluna e Quadril','Mobilidade & Yoga',92,155,'Sincronize amplitude e respiração profunda sem pressa.']
    ];
    const VARS = ['Peso Corporal','com Halteres','com Barra','com Kettlebell','com Elástico','na Polia / Cabo','Unilateral','Alternado','com Pausa 3s','Cadência Lenta 4-1-1','Isométrico + Rep','Inclinado','Declinado','Pegada Neutra','com Pulso','Explosivo','no Banco','Ajoelhado','Semi-Ajoelhado','no Solo','Base Fechada','Base Sumô','com Déficit','Pegada Pronada','Pegada Supinada','Sentado','em Pé','Rotacional','com Alcance','Avançado','Reabilitação','Controle Postural','Circuito HIIT','Potência','Resistência','Pirâmide','Drop Tempo','Bilateral','Escapular','Postural'];
    const EXERCISES = [];
    BASES.forEach((b, bi) => {
      VARS.forEach((v, vi) => {
        EXERCISES.push({
          id: `ex_${bi}_${vi}`,
          name: vi === 0 ? b[0] : `${b[0]} (${v})`,
          muscles: b[1],
          category: vi === 0 && bi < 4 ? 'Principais' : b[2],
          down: b[3], up: b[4], cue: b[5],
          difficulty: vi % 3 === 0 ? 'Iniciante' : vi % 3 === 1 ? 'Intermediário' : 'Avançado',
          equipment: v.includes('Halter') ? 'Halteres' : v.includes('Barra') ? 'Barra' : v.includes('Kettlebell') ? 'Kettlebell' : v.includes('Elástico') ? 'Elástico' : 'Peso Corporal'
        });
      });
    }); // 14 * 40 = 560 exercises!

    let activeExercise = EXERCISES[0];
    let camStream = null, workoutTimer = null, elapsedSec = 0, reps = 0, paused = false, setNum = 1;
    let chatHistory = [{ from: 'ai', text: `Olá! Sou o Coach FitVerso Web. Tenho ${EXERCISES.length} exercícios mapeados e você pode conectar sua chave Gemini, ChatGPT, DeepSeek, Voz ou Imagem em Modelos & APIs.` }];

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function saveState() {
      localStorage.setItem(STORAGE_AI, JSON.stringify(aiCfg));
      localStorage.setItem(STORAGE_HIST, JSON.stringify(historyList));
      localStorage.setItem(STORAGE_TIER, userTier);
      document.getElementById('ai-badge').textContent = `Texto: ${aiCfg.textProvider.toUpperCase()} (${aiCfg.textModel})`;
      document.getElementById('tier-badge').textContent = userTier === 'PREMIUM' ? 'PRO ✦' : 'BÁSICO';
      document.getElementById('sidebar-plan-title').textContent = userTier === 'PREMIUM' ? 'FitVerso Pro' : 'Plano Básico';
    }

    function go(view, btn) {
      document.getElementById('sidebar').classList.remove('open');
      if (btn) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      const views = ['home','live','exercises','history','coach','ai-config','plans'];
      views.forEach(v => document.getElementById('view-' + v).style.display = (v === view ? (v === 'live' ? 'flex' : 'block') : 'none'));
      const titles = { home:'Início', live:'Treino ao vivo', exercises:`Exercícios (${EXERCISES.length})`, history:'Histórico', coach:'Coach IA & Voz', 'ai-config':'Modelos & APIs (Texto / Voz / Imagem)', plans:'Planos & Assinatura' };
      document.getElementById('page-title').textContent = titles[view] || 'FitVerso';
      document.getElementById('topbar').style.display = (view === 'live' ? 'flex' : 'flex');
      if (view === 'home') renderHome();
      if (view === 'live') renderLive();
      if (view === 'exercises') renderExercises();
      if (view === 'history') renderHistory();
      if (view === 'coach') renderCoach();
      if (view === 'ai-config') renderAiConfig();
      if (view === 'plans') renderPlans();
    }

    function renderHome() {
      const last = historyList[0];
      document.getElementById('view-home').innerHTML = `
        <h1 style="margin-bottom:14px">Olá, Atleta! (Modo Web Mobile & PC)</h1>
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <div style="color:var(--muted);font-size:12px">Biblioteca ativa</div>
            <strong style="font-size:20px">${EXERCISES.length} exercícios guiados por IA</strong>
          </div>
          <div>
            <div style="color:var(--muted);font-size:12px">Sessões salvas</div>
            <strong style="font-size:20px">${historyList.length} treinos</strong>
          </div>
          <button class="btn btn-teal" onclick="go('live')">Começar treino rápido</button>
        </div>
        <div class="grid">
          <div class="card">
            <h3>Treino de Pernas - Iniciante</h3>
            <p style="color:var(--muted);font-size:13px;margin:8px 0 14px">Agachamento Livre guiado por câmera com contagem em tempo real.</p>
            <button class="btn btn-navy" onclick="startEx('${EXERCISES[0].id}')">Começar</button>
          </div>
          <div class="card">
            <h3>Último treino</h3>
            <p style="color:var(--muted);font-size:13px;margin:8px 0 14px">${last ? `${last.date} · ${last.name} · ${last.reps} reps` : 'Nenhum treino finalizado ainda neste navegador.'}</p>
            <button class="btn btn-outline" onclick="go('exercises')">Explorar ${EXERCISES.length} exercícios</button>
          </div>
        </div>
      `;
    }

    function startEx(id) {
      activeExercise = EXERCISES.find(e => e.id === id) || EXERCISES[0];
      reps = 0; elapsedSec = 0; paused = false;
      go('live');
    }

    async function startWebcam() {
      const video = document.getElementById('webcam-video');
      const status = document.getElementById('cam-status');
      try {
        if (camStream) camStream.getTracks().forEach(t => t.stop());
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        video.srcObject = camStream;
        status.textContent = '● Câmera conectada';
        status.style.color = '#3FB27F';
        drawAvatarLoop();
      } catch (e) {
        status.textContent = '● Permissão/HTTPS necessário para webcam';
        status.style.color = '#EAB308';
      }
    }

    let animId = null;
    function drawAvatarLoop() {
      const c = document.getElementById('avatar-canvas');
      if (!c) return;
      const ctx = c.getContext('2d');
      let t = 0;
      function frame() {
        t += paused ? 0 : 0.05;
        ctx.clearRect(0, 0, c.width, c.height);
        const cx = c.width / 2, bend = Math.sin(t) * 28 + 28;
        ctx.strokeStyle = '#3FB27F'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, 70 + bend * 0.4, 18, 0, Math.PI * 2);
        ctx.moveTo(cx, 90 + bend * 0.4); ctx.lineTo(cx, 175 + bend * 0.6);
        ctx.moveTo(cx - 42, 118 + bend * 0.4); ctx.lineTo(cx + 42, 118 + bend * 0.4);
        ctx.moveTo(cx, 175 + bend * 0.6); ctx.lineTo(cx - 32, 235 + bend * 0.3); ctx.lineTo(cx - 36, 295);
        ctx.moveTo(cx, 175 + bend * 0.6); ctx.lineTo(cx + 32, 235 + bend * 0.3); ctx.lineTo(cx + 36, 295);
        ctx.stroke();
        animId = requestAnimationFrame(frame);
      }
      if (animId) cancelAnimationFrame(animId);
      frame();
    }

    function renderLive() {
      const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      document.getElementById('view-live').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <span id="cam-status" style="background:#23303E;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600">● Clique em Ativar Câmera</span>
          <button class="btn btn-teal" onclick="startWebcam()">Ativar Webcam</button>
        </div>
        <div class="arena-grid">
          <div class="cam-box">
            <video id="webcam-video" autoplay playsinline muted></video>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
            <h2>${activeExercise.name}</h2>
            <div style="display:flex;align-items:center;gap:28px">
              <div><small style="color:#94A3B8">Série</small><div style="font-size:20px;font-weight:700">${setNum}/3</div></div>
              <div class="rep-box" id="rep-display" onclick="reps++;document.getElementById('rep-display').textContent=String(reps).padStart(2,'0')">${String(reps).padStart(2,'0')}</div>
              <div><small style="color:#94A3B8">Tempo</small><div id="timer-display" style="font-size:20px;font-weight:700">${fmt(elapsedSec)}</div></div>
            </div>
            <div class="feedback-pill" style="width:100%">✓ ${activeExercise.cue} (Ângulo alvo ${activeExercise.down}°–${activeExercise.up}°)</div>
            <div class="cam-box" style="width:100%;flex:1;min-height:260px">
              <canvas id="avatar-canvas" width="420" height="320"></canvas>
            </div>
          </div>
        </div>
        <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
          <button class="btn btn-coral" onclick="endLiveWorkout()">■ Encerrar</button>
          <button class="btn btn-amber" onclick="paused=!paused;this.textContent=paused?'▶ Retomar':'❚❚ Pausar'">${paused?'▶ Retomar':'❚❚ Pausar'}</button>
          <button class="btn btn-slate" onclick="reps++;document.getElementById('rep-display').textContent=String(reps).padStart(2,'0')">+1 Rep</button>
          <button class="btn btn-slate" onclick="go('exercises')">Trocar exercício</button>
        </div>
      `;
      if (workoutTimer) clearInterval(workoutTimer);
      workoutTimer = setInterval(() => {
        if (!paused) {
          elapsedSec++;
          const el = document.getElementById('timer-display');
          if (el) el.textContent = `${String(Math.floor(elapsedSec/60)).padStart(2,'0')}:${String(elapsedSec%60).padStart(2,'0')}`;
        }
      }, 1000);
      drawAvatarLoop();
    }

    function endLiveWorkout() {
      historyList.unshift({ date: new Date().toLocaleDateString('pt-BR'), name: activeExercise.name, reps: Math.max(reps, 1), sec: Math.max(elapsedSec, 15) });
      reps = 0; elapsedSec = 0;
      saveState();
      go('history');
    }

    let exQuery = '', exCat = 'Todos';
    function renderExercises() {
      const container = document.getElementById('view-exercises');
      const filtered = EXERCISES.filter(e =>
        (exCat === 'Todos' || e.category === exCat) &&
        (!exQuery || e.name.toLowerCase().includes(exQuery.toLowerCase()) || e.muscles.toLowerCase().includes(exQuery.toLowerCase()))
      );
      container.innerHTML = `
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <input class="input" style="flex:1;min-width:220px" placeholder="Buscar entre ${EXERCISES.length} exercícios..." value="${exQuery}" oninput="exQuery=this.value;renderExercises()" />
          <select style="width:220px" onchange="exCat=this.value;renderExercises()">
            <option ${exCat==='Todos'?'selected':''}>Todos</option>
            ${CATEGORIES.map(c => `<option ${exCat===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:10px">${filtered.length} exercícios encontrados</div>
        <div class="grid">
          ${filtered.slice(0, 120).map(e => `
            <div class="card" style="margin:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px">
              <div>
                <span style="font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:3px 8px;border-radius:6px">${e.equipment}</span>
                <h4 style="margin-top:8px">${e.name}</h4>
                <div style="color:var(--muted);font-size:12px">${e.muscles} · ${e.difficulty}</div>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn btn-outline" style="flex:1;padding:8px" onclick="openTeachModal('${e.id}')">IA Ensina</button>
                <button class="btn btn-teal" style="flex:1;padding:8px" onclick="startEx('${e.id}')">Treinar</button>
              </div>
            </div>
          `).join('')}
        </div>
        ${filtered.length > 120 ? `<p style="color:var(--muted);margin-top:12px">Mostrando os primeiros 120 de ${filtered.length} resultados. Use a busca acima para filtrar os ${EXERCISES.length} exercícios.</p>` : ''}
      `;
    }

    async function openTeachModal(exId) {
      const ex = EXERCISES.find(e => e.id === exId) || EXERCISES[0];
      const modal = document.getElementById('teach-modal');
      const body = document.getElementById('teach-modal-body');
      modal.classList.add('open');
      body.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3>${ex.name}</h3>
          <button class="btn btn-outline" style="padding:6px 12px" onclick="document.getElementById('teach-modal').classList.remove('open')">Fechar</button>
        </div>
        <p style="color:var(--muted);font-size:13px;margin-bottom:12px">${ex.muscles} · ${ex.equipment} · Ângulo ${ex.down}°–${ex.up}°</p>
        <div class="card" style="background:#F8FAFC">
          <strong>Guia Biomecânico Base:</strong>
          <p style="margin-top:6px;font-size:14px">${ex.cue}</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <button class="btn btn-teal" onclick="runAiTeach('${ex.id}')">✨ Explicar Jeito Correto (${aiCfg.textProvider.toUpperCase()})</button>
          <button class="btn btn-navy" onclick="speakBrowser('${ex.cue.replace(/'/g,"")}')">🔊 Ouvir Voz</button>
          <button class="btn btn-outline" onclick="runImageGen('${ex.id}')">🖼️ Gerar Imagem (${aiCfg.imageProvider})</button>
        </div>
        <div id="teach-ai-output" style="font-size:14px;line-height:1.5;white-space:pre-wrap"></div>
        <div id="teach-img-output" style="margin-top:12px"></div>
      `;
    }

    async function runAiTeach(exId) {
      const ex = EXERCISES.find(e => e.id === exId);
      const out = document.getElementById('teach-ai-output');
      out.textContent = 'Consultando IA selecionada...';
      const reply = await callTextAi(`Ensine detalhadamente como fazer o exercício "${ex.name}" (${ex.muscles}) corretamente, respiração e erros comuns a evitar.`);
      out.textContent = reply;
    }

    async function runImageGen(exId) {
      const ex = EXERCISES.find(e => e.id === exId);
      const box = document.getElementById('teach-img-output');
      if (!aiCfg.imageKey || aiCfg.imageProvider === 'diagram') {
        box.innerHTML = `<div class="card" style="background:#16202C;color:#fff">Diagrama local para <strong>${ex.name}</strong> (ângulo ${ex.down}° ↔ ${ex.up}°). Para gerar imagens fotorrealistas, configure sua API de Imagem em Modelos &amp; APIs.</div>`;
        return;
      }
      box.textContent = 'Gerando ilustração com API de Imagem...';
      try {
        if (aiCfg.imageProvider === 'openai') {
          const r = await fetch('https://api.openai.com/v1/images/generations', {
            method: 'POST', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + aiCfg.imageKey },
            body: JSON.stringify({ model: aiCfg.imageModel, prompt: `Minimalist athletic coaching diagram showing correct posture for ${ex.name}`, size: '1024x1024' })
          });
          const d = await r.json();
          const url = d.data?.[0]?.url || ('data:image/png;base64,' + d.data?.[0]?.b64_json);
          box.innerHTML = `<img src="${url}" style="width:100%;border-radius:12px" />`;
        } else {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${aiCfg.imageModel}:generateContent?key=${aiCfg.imageKey}`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ contents:[{parts:[{text:`Fitness illustration showing correct form for ${ex.name}`}]}], generationConfig:{responseModalities:['TEXT','IMAGE']} })
          });
          const d = await r.json();
          const p = d.candidates?.[0]?.content?.parts?.find(x => x.inlineData);
          if (p) box.innerHTML = `<img src="data:${p.inlineData.mimeType};base64,${p.inlineData.data}" style="width:100%;border-radius:12px" />`;
          else box.textContent = JSON.stringify(d).slice(0,220);
        }
      } catch (e) { box.textContent = 'Erro na geração de imagem: ' + e.message; }
    }

    async function callTextAi(prompt) {
      const p = aiCfg.textProvider, key = aiCfg.textKey.trim(), model = aiCfg.textModel.trim();
      if (p === 'offline' || !key) {
        return `Modo Local: Para "${activeExercise.name}", mantenha ${activeExercise.cue} (Configure Gemini, ChatGPT ou DeepSeek em Modelos & APIs para respostas personalizadas.)`;
      }
      try {
        if (p === 'gemini') {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ contents:[{role:'user',parts:[{text:prompt}]}] })
          });
          const d = await r.json();
          return d.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(d);
        } else {
          const url = p === 'openai' ? 'https://api.openai.com/v1/chat/completions' : p === 'deepseek' ? 'https://api.deepseek.com/chat/completions' : aiCfg.textUrl;
          const r = await fetch(url, {
            method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
            body: JSON.stringify({ model, messages:[{role:'system',content:'Você é o Coach FitVerso em português.'},{role:'user',content:prompt}] })
          });
          const d = await r.json();
          return d.choices?.[0]?.message?.content || JSON.stringify(d);
        }
      } catch (e) { return 'Erro de conexão com a API: ' + e.message; }
    }

    async function speakBrowser(txt) {
      if (aiCfg.voiceProvider === 'openai' && aiCfg.voiceKey) {
        const r = await fetch('https://api.openai.com/v1/audio/speech', {
          method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + aiCfg.voiceKey},
          body: JSON.stringify({ model: aiCfg.voiceModel, voice: aiCfg.voiceId || 'alloy', input: txt })
        });
        const blob = await r.blob();
        new Audio(URL.createObjectURL(blob)).play();
      } else if (aiCfg.voiceProvider === 'elevenlabs' && aiCfg.voiceKey) {
        const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${aiCfg.voiceId || '21m00Tcm4TlvDq8ikWAM'}`, {
          method:'POST', headers:{'Content-Type':'application/json','xi-api-key':aiCfg.voiceKey},
          body: JSON.stringify({ text: txt, model_id: aiCfg.voiceModel })
        });
        const blob = await r.blob();
        new Audio(URL.createObjectURL(blob)).play();
      } else if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'pt-BR';
        speechSynthesis.speak(u);
      }
    }

    function renderHistory() {
      document.getElementById('view-history').innerHTML = historyList.length === 0
        ? `<div class="card">Nenhum treino registrado ainda. Finalize um treino ao vivo!</div>`
        : historyList.map(h => `<div class="card" style="display:flex;justify-content:space-between"><strong>${h.date} - ${h.name}</strong><span>${h.reps} reps · ${h.sec}s ✓</span></div>`).join('');
    }

    function renderCoach() {
      document.getElementById('view-coach').innerHTML = `
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <div>
            <strong>Coach IA Multi-Modelo</strong>
            <div style="color:var(--muted);font-size:12px">Texto: ${aiCfg.textProvider} (${aiCfg.textModel}) · Voz: ${aiCfg.voiceProvider} · Imagem: ${aiCfg.imageProvider}</div>
          </div>
          <button class="btn btn-outline" onclick="go('ai-config')">Configurar APIs</button>
        </div>
        <div class="card">
          <div class="chat-box" id="chat-box">
            ${chatHistory.map(m => `<div class="msg ${m.from==='user'?'msg-user':'msg-ai'}">${m.text}</div>`).join('')}
          </div>
          <div style="display:flex;gap:8px">
            <input class="input" id="coach-input" placeholder="Pergunte sobre qualquer um dos ${EXERCISES.length} exercícios..." />
            <button class="btn btn-teal" onclick="sendChat()">Enviar</button>
          </div>
        </div>
      `;
    }

    async function sendChat() {
      const inp = document.getElementById('coach-input');
      const txt = inp.value.trim(); if (!txt) return;
      chatHistory.push({ from:'user', text: txt });
      inp.value = ''; renderCoach();
      const reply = await callTextAi(txt);
      chatHistory.push({ from:'ai', text: reply });
      renderCoach();
      speakBrowser(reply);
    }

              <option value="offline" ${aiCfg.textProvider==='offline'?'selected':''}>Local Offline (Sem chave)</option>
              <option value="gemini" ${aiCfg.textProvider==='gemini'?'selected':''}>Google Gemini</option>

              <option value="openai" ${aiCfg.imageProvider==='openai'?'selected':''}>OpenAI Images (gpt-image-1 / dall-e-3)</option>
            </select>

          </div>

      document.getElementById('view-plans').innerHTML = `

    function crc32(bytes) {
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) {
        crc ^= bytes[i];
        for (let j = 0; j < 8; j++) {
          crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
        }
      }
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    function buildOfflineZipBlob(files) {
      const enc = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      files.forEach(file => {
        const nameBytes = enc.encode(file.name);
        const data = typeof file.content === 'string' ? enc.encode(file.content) : file.content;
        const crc = crc32(data);
        const lh = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(lh.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(8, 0, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, data.length, true);
        lv.setUint32(22, data.length, true);
        lv.setUint16(26, nameBytes.length, true);
        lh.set(nameBytes, 30);
        localParts.push(lh, data);

        const ch = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(ch.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, data.length, true);
        cv.setUint32(24, data.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint32(42, offset, true);
        ch.set(nameBytes, 46);
        centralParts.push(ch);
        offset += lh.length + data.length;
      });
      const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, files.length, true);
      ev.setUint16(10, files.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, offset, true);
      return new Blob([...localParts, ...centralParts, eocd], { type: 'application/zip' });
    }

    async function downloadProjectZip() {
      try {
        if (location.protocol.startsWith('http')) {
          const r = await fetch('/download/project.zip');
          if (r.ok && (r.headers.get('content-type') || '').includes('zip')) {
            const blob = await r.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'FitVerso-Projeto-Completo.zip';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 5000);
            return;
          }
        }
      } catch (e) {}
      const readme = '# FitVerso Web Package\n\nPara baixar o código Android Kotlin completo, abra o app Android FitVerso -> Perfil -> Baixar Projeto Inteiro (.ZIP).\n';
      const blob = buildOfflineZipBlob([
        { name: 'web/index.html', content: '<!DOCTYPE html>\n' + document.documentElement.outerHTML },
        { name: 'README.md', content: readme }
      ]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'FitVerso-Web-Projeto.zip';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    saveState();
    renderHome();
  </script>
